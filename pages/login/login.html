<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre na sua conta - Crazy People - a rede social das suas loucuras</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="grid-vertical">
        <div class="container-content">
            <h1 class="title">Bem vindo de volta à <br> loucura!</h1>
            <form action="" id="form-login" onsubmit="return false" method="post" class="form-centered">
                
                 <div class="form-group">
                    <label for="">E-mail</label>
                    <input type="email" name="email" id="email" placeholder="email@email.com">
                </div>

                <div class="form-group">
                    <label for="">Senha</label>
                    <div class="input-password">
                        <input type="password" name="password" id="password">
                        <i class="bi bi-eye icon-eye"></i>
                        <!-- <i class="bi bi-eye-slash"></i> -->
                    </div>
                </div>

                <div class="tips">
                    <div class="tip">
                        <div class="tip-icon success" id="error-uppercase">

                        </div>
                        <div class="tip-text">
                            Uma letra maiúscula.
                        </div>
                    </div>

                    <div class="tip">
                        <div class="tip-icon error" id="error-number">

                        </div>
                        <div class="tip-text">
                            Um número.
                        </div>
                    </div>

                    <div class="tip">
                        <div class="tip-icon success" id="error-lowercase">

                        </div>
                        <div class="tip-text">
                            Uma letra minúscula.
                        </div>
                    </div>

                    <div class="tip">
                        <div class="tip-icon success" id="error-minlength">

                        </div>
                        <div class="tip-text">
                            No mínimo 8 caracteres.
                        </div>
                    </div>
                </div>

                <div class="center">
                    <a href="../recovery-password/recovery-password.html" class="general">Esqueci minha senha</a>
                </div>

            </form>
        </div>

        <div class="group-buttons">
            <a class="button button-primary" href="../feed/feed.html">Logar</a>
            <a class="button button-cancel" href="../../index.html">Cancelar</a>
            
        </div>
    </div>
</body>
</html>
